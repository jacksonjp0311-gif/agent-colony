name: Read-only tests
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Existing test dependencies
        run: |
          python -m pip install -r requirements.txt
          # Same optional backend used by the evolution job; historical sieve
          # checks are prohibitively slow with the pure-Python fallback.
          sudo apt-get install -y -qq libprimesieve-dev primesieve
      - name: Full suite including isolated real-cycle regressions
        run: python -m pytest tests -q
