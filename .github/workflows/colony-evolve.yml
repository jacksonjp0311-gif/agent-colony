# Agent Colony — production self-run loop (GitHub Actions cron)
# gather → claim → hard bench → keep/revert → lesson → selective authorize → slim push
# Failure noisy; success quiet. CI never silent-accept-all. Not AGI. Not Millennium.
name: Colony evolve

on:
  schedule:
    - cron: "26 */6 * * *"
  workflow_dispatch:
    inputs:
      cycles:
        description: "Number of evolve cycles"
        required: false
        default: "3"
      offline:
        description: "Offline seed-only (true/false)"
        required: false
        default: "false"
      authorize:
        description: "Run selective standing-trust authorize (true/false)"
        required: false
        default: "true"

permissions:
  contents: write

concurrency:
  group: colony-evolve
  cancel-in-progress: false

jobs:
  evolve:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Hard benches (noisy on fail)
        id: benches
        run: |
          set -euo pipefail
          export PYTHONPATH=.
          python -m society.benchmarks.run_benchmarks
          python -m colony bench-improve || echo "::warning::bench-improve non-fatal"
          python - <<'PY'
          import json, os, sys
          from pathlib import Path
          latest = json.loads(Path("society/benchmarks/latest.json").read_text())
          ok = bool(latest.get("ok_all"))
          print(json.dumps({"ok_all": ok, "aggregate_score": latest.get("aggregate_score")}, indent=2))
          if not ok:
              print("::error::HARD BENCH FAIL ok_all=false — failure is noisy; continuing to record witness")
              # Non-zero only when AUTOFAIL=1 (operator opt-in)
              if os.environ.get("AUTOFAIL") == "1":
                  sys.exit(2)
          else:
              # success quiet
              print("benches ok (quiet)")
          PY

      - name: Gather → claim → evolve (keep/revert + lessons)
        env:
          CYCLES: ${{ github.event.inputs.cycles || '3' }}
          OFFLINE: ${{ github.event.inputs.offline || 'false' }}
        run: |
          set -euo pipefail
          export PYTHONPATH=.
          # Optional live gather pulse (pointers only; raw scrape ≠ discovery)
          python - <<'PY' || echo "::warning::claim pipeline preflight non-fatal"
          from colony.claim_pipeline import run_pipeline
          import json
          out = run_pipeline(live_gather=False, cycle_id="ci_preflight")
          print(json.dumps({k: out.get(k) for k in ("n_extracted","n_hard_checked","n_proposed","note")}, indent=2))
          PY
          ARGS=(evolve --cycles "$CYCLES")
          if [ "$OFFLINE" = "true" ]; then ARGS+=(--offline); fi
          python -m colony "${ARGS[@]}"
          python -m colony dashboard || true
          python -m colony status > society/CI_STATUS.json || true

      - name: Selective authorize (standing trust P≥0.75 — never accept-all)
        if: ${{ github.event.inputs.authorize != 'false' }}
        run: |
          set -euo pipefail
          export PYTHONPATH=.
          python - <<'PY'
          """Selective standing-trust authorize for machine-checked keeps only.
          Never accept-all. P≥0.75. UNKNOWN stays UNKNOWN. Not AGI.
          """
          import json
          from pathlib import Path
          from colony.authorize import AuthorizeItem, Authorizer
          from colony.ledger import Ledger
          from colony.society_state import SocietyState

          root = Path(".")
          state = SocietyState.load(root / "data" / "society_state.json")
          ledger = Ledger(root / "data" / "ledger.jsonl", extra_roles=state.role_names())
          items = []
          rejected = []
          for f in ledger.all()[-120:]:
              tags = set(f.tags or [])
              meta = f.meta or {}
              title = (f.title or "") + " " + (f.claim or "")
              # ACCEPT only: machine-checked hard keep / multihop bus-driven / novelty-gated
              if f.status != "candidate":
                  continue
              is_keep = ("keep" in tags and ("hard_enable" in tags or meta.get("mutation_kind") == "hard_enable"))
              is_multihop = "multihop" in tags and "bus_driven" in tags
              is_lemma_keep = meta.get("kind") == "lemma_mutation" and meta.get("decision") == "keep"
              if is_keep or is_multihop or is_lemma_keep:
                  if "easy_pad" in tags or "not_discovery" not in tags and "easy_pad" in title:
                      rejected.append(AuthorizeItem(f.id, "rejected", "Standing trust: easy_pad / non-machine path rejected. Selective."))
                      continue
                  items.append(AuthorizeItem(
                      f.id, "accepted",
                      "Standing trust P≥0.75: machine-checked hard-tier/Oracle/bus-driven candidate. Not novel theorem. Selective authorize."
                  ))
              elif "easy_pad" in tags or (meta.get("decision") == "revert"):
                  rejected.append(AuthorizeItem(
                      f.id, "rejected",
                      "Standing trust: revert/easy_pad — reject durable accept. Selective."
                  ))
          # Cap accepts — never accept-all
          items = items[:8]
          rejected = rejected[:12]
          batch = items + rejected
          if not batch:
              print("authorize: nothing selective this run (quiet success)")
              Path("society/receipts/AUTHORIZE_DECISIONS_spark_ci.json").write_text(
                  json.dumps({"items": [], "policy": "standing_trust_P>=0.75_selective_never_accept_all", "mile": "spark"}, indent=2)+"\n"
              )
          else:
              decisions = {
                  "items": [{"finding_id": i.finding_id, "decision": i.decision, "rationale": i.rationale} for i in batch],
                  "policy": "standing_trust_P>=0.75_selective_never_accept_all",
                  "mile": "spark",
              }
              dec_path = Path("society/receipts/AUTHORIZE_DECISIONS_spark_ci.json")
              dec_path.write_text(json.dumps(decisions, indent=2) + "\n")
              result = Authorizer(root=root, ledger=ledger, state=state).apply(
                  batch,
                  authorizer="James Paul Jackson",
                  delegated_via="GitHub Actions cron (standing trust P>=0.75 selective; never accept-all)",
              )
              print(json.dumps({
                  "accepted": len(result.accepted),
                  "rejected": len(result.rejected),
                  "skipped": len(result.skipped),
                  "receipt": str(result.receipt_path),
              }, indent=2))
          PY

      - name: Slim receipts (skip giant JSONL rewrite)
        run: |
          set -euo pipefail
          export PYTHONPATH=.
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          from colony.dashboard import refresh_dashboard
          refresh_dashboard()
          # Slim society mirror — do NOT rewrite multi-MB ledger/witness JSONL in CI commit noise
          latest = {}
          lp = Path("society/benchmarks/latest.json")
          if lp.exists():
              latest = json.loads(lp.read_text())
          bus = {}
          sp = Path("data/society_state.json")
          cycle_count = None
          fit = None
          if sp.exists():
              # Avoid loading entire multi-MB state if possible — still needed for metrics
              d = json.loads(sp.read_text())
              cycle_count = d.get("cycle_count")
              fit = (d.get("fitness_history") or [None])[-1]
              bus = d.get("bus_metrics_latest") or {}
          nov = {}
          np = Path("society/systems/novelty_gate.json")
          if np.exists():
              nov = json.loads(np.read_text())
          deb = {}
          dp = Path("society/systems/debate_multihop.json")
          if dp.exists():
              deb = json.loads(dp.read_text())
          bud = {}
          bp = Path("society/systems/exploration_budget.json")
          if bp.exists():
              bud = json.loads(bp.read_text())
          ora = {}
          try:
              from colony.oracle import counts as oracle_counts
              ora = oracle_counts()
          except Exception as e:
              ora = {"error": str(e)}
          receipt = {
              "when": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "mile": "spark",
              "cycle_count": cycle_count,
              "fitness_latest": fit,
              "bus_metrics": bus,
              "benches": {"ok_all": latest.get("ok_all"), "aggregate_score": latest.get("aggregate_score")},
              "novelty_gate": {"hits": nov.get("hits"), "kills": nov.get("kills")},
              "debate_multihop": {k: deb.get(k) for k in ("action_changed", "code_touched", "bus_metrics") if k in deb or True},
              "exploration_budget_fp": (bud.get("last_outcome") or {}),
              "oracle": ora,
              "easy_pad_dies": bool(ora.get("easy_pad_kills")),
              "note": "Slim CI receipt. Giant JSONL not rewritten. Spark mile. Not AGI. Not novel theorems.",
          }
          Path("society/receipts").mkdir(parents=True, exist_ok=True)
          Path("society/receipts/SOCIETY_SLIM_SPARK.json").write_text(json.dumps(receipt, indent=2) + "\n")
          Path("society/EVOLVE_STATUS.md").write_text(
              "# Evolve Status — Spark mile\n\n"
              "> We light the spark and witness. We do not micromanage the city.\n\n"
              "![Spark and witness](../docs/assets/spark_witness_city.jpg)\n\n"
              f"- cycle_count: `{cycle_count}`\n"
              f"- benches ok_all: `{latest.get('ok_all')}` score `{latest.get('aggregate_score')}`\n"
              f"- novelty hits/kills: `{nov.get('hits')}` / `{nov.get('kills')}`\n"
              f"- debate action_changed: `{deb.get('action_changed')}`\n"
              f"- oracle passes/kills/easy_kills: `{ora.get('passes')}` / `{ora.get('kills')}` / `{ora.get('easy_pad_kills')}`\n"
              "- CI: gather→claim→bench→evolve→lesson→selective authorize P≥0.75→slim push\n"
              "- Spark: pressure reply_rate via load-bear multi-hop; Oracle kill easy_pad; lessons→genome; spawn on Oracle-pass lift; P≥0.75. Failure noisy; success quiet. Not AGI. Not Millennium.\n"
          )
          print("slim receipts written (quiet)")
          PY

      - name: Commit slim society outputs
        run: |
          set -euo pipefail
          git config user.name "agent-colony-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Prefer slim paths; still allow data/society but avoid forcing giant churn messages
          git add -A data/commons society/systems society/benchmarks society/receipts \
            society/EVOLVE_STATUS.md society/DASHBOARD.html society/WITNESS_SUMMARY.md \
            society/BULLETIN.md society/report.md society/CI_STATUS.json \
            society/genomes society/briefs docs .github || true
          # Include society_state only if changed size reasonable — always add but message notes slim
          git add data/society_state.json data/ledger.jsonl data/witness.jsonl society/WITNESS.md 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No society changes to commit (quiet success)"
          else
            git commit -m "ci(colony): spark loop benches+evolve+selective $(date -u +%Y-%m-%dT%H%MZ)"
            git push
          fi
