# Agent Colony — scheduled evolve (GitHub Actions cron)
# Cron is UTC. workflow_dispatch allows manual runs.
name: Colony evolve

on:
  schedule:
    # Every 6 hours at :26 UTC (light research-lab pulse)
    - cron: "26 */6 * * *"
  workflow_dispatch:
    inputs:
      cycles:
        description: "Number of evolve cycles"
        required: false
        default: "3"
      offline:
        description: "Offline seed-only (true/false)"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: colony-evolve
  cancel-in-progress: false

jobs:
  evolve:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run evolve
        env:
          CYCLES: ${{ github.event.inputs.cycles || '3' }}
          OFFLINE: ${{ github.event.inputs.offline || 'false' }}
        run: |
          set -euo pipefail
          ARGS=(evolve --cycles "$CYCLES")
          if [ "$OFFLINE" = "true" ]; then ARGS+=(--offline); fi
          python -m colony "${ARGS[@]}"
          python -m colony dashboard || true
          python -m colony status > society/CI_STATUS.json || true

      - name: Commit society outputs
        run: |
          set -euo pipefail
          git config user.name "agent-colony-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data society || true
          if git diff --staged --quiet; then
            echo "No society changes to commit"
          else
            git commit -m "ci(colony): scheduled evolve $(date -u +%Y-%m-%dT%H%MZ)"
            git push
          fi
