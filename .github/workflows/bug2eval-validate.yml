name: bug2eval validate
# Validates the captured regression evals (before fails / after passes). Manual + weekly only;
# never part of the evolve cycle. Free GitHub-hosted runner.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * 1"
permissions:
  contents: read
concurrency:
  group: bug2eval-validate
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest "git+https://github.com/jacksonjp0311-gif/bug2eval"
          sudo apt-get install -y -qq libprimesieve-dev primesieve || echo "::warning::primesieve not installed"
      - name: Validate cases
        run: evals/bug2eval/validate_all.sh
